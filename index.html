<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171e17" />
    <link rel="icon" type="image/png" sizes="64x64" href="%BASE_URL%seedling.png" />
    <title>Where the Water Turns</title>
  </head>
  <body>
    <main id="experience" aria-describedby="path-instructions">
      <p id="path-instructions" hidden>Scroll down to follow the woodland path and up to go back.</p>
      <div id="scene">
        <div id="viewport" role="img" aria-label="A woodland path beside a creek"></div>
        <div id="status" role="status">
          <span class="seedling" aria-hidden="true">
            <span class="seedling-stem">
              <span class="seedling-leaf seedling-leaf-left"></span>
              <span class="seedling-leaf seedling-leaf-right"></span>
            </span>
          </span>
          <p id="status-message">Entering the woodland…</p>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
